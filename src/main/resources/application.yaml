spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tech_store_version_1?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # dev OK, prod nên dùng validate
    show-sql: true
    properties:
      hibernate:
        database-platform: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080

# JWT Config
jwt:
  secret: "your-super-secret-key-at-least-256-bits-long-here"
  access-token-expiry: 86400000
  refresh-token-expiry: 604800000

# Cloudinary
cloudinary:
  cloud-name: your_cloud_name
  api-key: your_api_key
  api-secret: your_api_secret

# CORS
cors:
  allowed-origins: "http://localhost:5173"

